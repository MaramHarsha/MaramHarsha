<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 500 60'
    style='background-color: #00000000;'
    width='500px' height='60px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d3.end'
                    dur='4000ms' fill='remove'
                    values='m0,30 h0 ; m0,30 h500 ; m0,30 h500 ; m0,30 h0' keyTimes='0;0.6;0.85;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#00F0FF' font-size='30'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Hi, I&#039;m Sai Harsha! 👋
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='4000ms' fill='remove'
                    values='m0,30 h0 ; m0,30 h500 ; m0,30 h500 ; m0,30 h0' keyTimes='0;0.6;0.85;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#00F0FF' font-size='30'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Ethical Hacker (CEH Master)
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='4000ms' fill='remove'
                    values='m0,30 h0 ; m0,30 h500 ; m0,30 h500 ; m0,30 h0' keyTimes='0;0.6;0.85;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#00F0FF' font-size='30'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            Full Stack Developer
        </textPath>
    </text>
        <path id='path3'>
                            <!-- Single line -->
                                <animate id='d3' attributeName='d' begin='d2.end'
                    dur='4000ms' fill='remove'
                    values='m0,30 h0 ; m0,30 h500 ; m0,30 h500 ; m0,30 h0' keyTimes='0;0.6;0.85;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#00F0FF' font-size='30'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path3'>
            Cybersecurity Researcher
        </textPath>
    </text>
</svg>
